name: Deploy to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP لهذا الحساب يهبط مباشرة على جذر kek.emdatra.org، فالرفع للجذر لا لمجلد فرعي
          server-dir: ./
          # .htaccess يضبط رؤوس الأمان، ويُستثنى افتراضياً كملف مخفي
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
