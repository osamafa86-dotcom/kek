name: Apply pending patch

on:
  push:
    branches: [main]
    paths: ['.ci-patch/**']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch, then remove patch and this workflow
        run: |
          set -euo pipefail
          base64 -d .ci-patch/pw.patch.b64 > /tmp/p.patch
          git apply --verbose /tmp/p.patch
          node --input-type=module -e '
            import fs from "fs";
            const h = fs.readFileSync("index.html", "utf8");
            const m = h.match(/<script\b[^>]*>([\s\S]*?)<\/script>/g) || [];
            for (const b of m) {
              const body = b.replace(/^<script[^>]*>/, "").replace(/<\/script>$/, "");
              new Function(body);
            }
            if (!h.includes("submitAdminPw")) throw new Error("gate missing");
            console.log("index.html OK, " + m.length + " script blocks parse");
          '
          rm -rf .ci-patch .github/workflows/ci-apply-patch.yml
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Require a password before opening the admin panel

          Clicking the admin panel now shows a password prompt instead of
          opening the dashboard directly. A wrong entry shakes the box, shows
          an error, and clears the field; the correct one unlocks the panel
          for the rest of the page session. Logging out or reloading re-locks
          it. The prompt is translated into Arabic, Turkish, and English.

          Note: this is a client-side convenience lock, not real security --
          the password is visible in the page source.'
          git push
